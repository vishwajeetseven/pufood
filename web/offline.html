<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PU Food - Offline</title>
    <style>
        body {
            font-family: "Poppins", sans-serif;
            text-align: center;
            padding: 20px;
        }
        .offline-message {
            margin-top: 50px;
            font-size: 1.2rem;
        }
        .retry-button {
            padding: 10px 20px;
            background: #de4e4e;
            color: white;
            border: none;
            border-radius: 5px;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>PU Food</h1>
    <div class="offline-message">
        <p>You are currently offline.</p>
        <p>Please check your internet connection and try again.</p>
        <button class="retry-button" onclick="window.location.reload()">Retry</button>
    </div>
</body>
</html>
