name: pufood
description: "A new Flutter project."
publish_to: "none"

version: 1.0.1+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.3.0
  syncfusion_flutter_pdfviewer: ^29.1.39
  flutter_staggered_grid_view: ^0.7.0
  flutter_launcher_icons: ^0.13.1
  flutter_animate: ^4.5.2
  fl_chart: ^0.71.0

  firebase_core: ^2.24.2
  firebase_analytics: ^10.7.4

  package_info_plus: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/splash_screen/splash_screen.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  adaptive_icon_monochrome: "assets/images/app_icon.png"
  android_adaptive_icon_background: "#FFFFFF"
  android_adaptive_icon_foreground: "assets/images/app_icon.png"
  android_adaptive_icon_monochrome: "assets/images/app_icon.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
